[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedcup-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["seedcup==0.4.3", "numpy==2.2.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tank = "tank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tank*"]
